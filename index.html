    <style>
      /* ===== TradeProFX Community brand theme override =====================
         The app is Tailwind v4, so every utility reads a CSS variable.
         Redefining these :root tokens (after the compiled sheet) recolors and
         re-types the entire UI in one place — navy base + signature teal. */
      :root {
        /* Typography */
        --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --default-font-family: var(--font-sans);
        --default-mono-font-family: var(--font-mono);

        /* Signature accent: emerald ramp shifted to TradeProFX aqua-teal */
        --color-emerald-50:  oklch(97% .02 185);
        --color-emerald-100: oklch(94% .05 185);
        --color-emerald-200: oklch(90% .09 185);
        --color-emerald-300: oklch(84% .12 185);
        --color-emerald-400: oklch(79% .14 185);
        --color-emerald-500: oklch(73% .14 185);
        --color-emerald-600: oklch(64% .12 186);
        --color-emerald-700: oklch(53% .10 187);
        --color-emerald-800: oklch(43% .08 188);
        --color-emerald-900: oklch(34% .06 189);
        --color-emerald-950: oklch(25% .05 191);

        /* teal is also used in places — keep it aligned with the accent */
        --color-teal-400: oklch(79% .14 186);
        --color-teal-500: oklch(73% .14 186);
        --color-teal-600: oklch(64% .12 187);

        /* Base surfaces: neutral zinc darks tinted to deep navy */
        --color-zinc-950: oklch(16% .022 256);
        --color-zinc-900: oklch(20% .026 256);
        --color-zinc-800: oklch(27% .030 256);
        --color-zinc-700: oklch(37% .030 257);
        --color-zinc-600: oklch(50% .028 258);
      }
      body { background: radial-gradient(1100px 560px at 85% -8%, #0d1b33 0%, transparent 58%), radial-gradient(760px 460px at -5% 0%, #0a1726 0%, transparent 55%); background-color: #070b16; }

      /* Floating launcher to the live synthetic-markets desk */
      #tpfx-live-launch {
        position: fixed; right: 18px; bottom: 18px; z-index: 9999;
        display: flex; align-items: center; gap: 9px;
        font-family: var(--font-sans); font-weight: 600; font-size: 13.5px;
        padding: 12px 17px; border-radius: 999px; color: #04231f;
        background: linear-gradient(135deg, #17e0c1, #0fb9a3);
        box-shadow: 0 8px 26px rgba(23, 224, 193, .32); text-decoration: none;
        transition: transform .15s, box-shadow .15s;
      }
      #tpfx-live-launch:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(23, 224, 193, .45); }
      #tpfx-live-launch .pulse { width: 9px; height: 9px; border-radius: 50%; background: #04231f; animation: tpfxp 1.5s infinite; }
      @keyframes tpfxp { 0%,100%{opacity:1} 50%{opacity:.35} }
      @media (max-width: 640px) { #tpfx-live-launch span.lbl { display: none; } #tpfx-live-launch { padding: 13px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a id="tpfx-live-launch" href="/markets.html" title="Live Deriv synthetic-markets signals">
      <span class="pulse"></span><span class="lbl">Live Synthetic Markets</span>
    </a>
